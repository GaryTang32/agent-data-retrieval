name: ci
on:
  push:
  pull_request:
    branches: [main]  # pushes to this repo's branches already run on push
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a hung gate subprocess fails fast (pre-run review)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev,mcp]'
      - run: ruff check .
      - run: pytest -q -W error
