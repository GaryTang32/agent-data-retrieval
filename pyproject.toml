[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adr-eval"
version = "0.1.0"
description = "Phase 0 evaluation harness for agent data retrieval (work in progress)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Exact pins: these versions produced the recorded golden sets and baselines (extracted
# text offsets, BM25 and dense scores depend on them). onnxruntime and tokenizers are not
# imported directly but run fastembed's embedding model, so they fix the dense scores.
dependencies = [
    "pydantic==2.14.3",
    "bm25s==0.3.16",
    "fastembed==0.9.1",
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
    "numpy==2.5.4",
    "anthropic==2.6.0",
    "httpx==0.28.1",
    "pypdf==7.0.0",
    "trafilatura==2.3.1",
    "lxml==6.1.3",
    "pyarrow==26.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[project.scripts]
adr-eval = "adr_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adr_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: downloads the embedding model"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
